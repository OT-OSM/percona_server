---
# =============================================================================
# Percona Server Role — Default Variables
# =============================================================================
#
#   Sensitive values (passwords, endpoints) MUST be overridden via:
#   - Ansible Vault (group_vars/vault.yml)
#   - Semaphore Environment Variables
#   - vars/vars.yml in playbook directory
#
#   Defaults here are for REFERENCE ONLY
# =============================================================================

# =====================================================
# FEATURE TOGGLES — Percona Server
# =====================================================
percona_replication:                false
percona_backup:                     false
percona_database_creation:          true
percona_users_creation:             true
percona_metrics_enabled:            true
percona_root_password_update:       false
percona_install_packages:           true

# =====================================================
# FEATURE TOGGLES — HA Components
# Set per play in playbook.yml — do not change here
# =====================================================
percona_orchestrator_install:        false
percona_orchestrator_configure:      false
percona_proxysql_install:            false
percona_proxysql_configure:          false
percona_minio_configure:             false
percona_configure_replication_users: false
percona_deploy_failover_script:      false
percona_deploy_backup_scripts:       false
percona_setup_backup_cron:           false
percona_backup_server:               false
percona_pmm_enabled:                 false

# =====================================================
# INVENTORY GROUP NAMES
# Override to match your inventory group names
# =====================================================
percona_master_group:       "percona-master"
percona_slave_group:        "percona-slave"
percona_orchestrator_group: "percona-orchestrator"

# =====================================================
# MYSQL — CONNECTION & GENERAL
# =====================================================
percona_port:              "3306"
percona_bind_address:      "0.0.0.0"
percona_skip_name_resolve: false
percona_datadir:           /var/lib/mysql
percona_socket:            /var/run/mysqld/mysqld.sock
percona_sql_mode:          "STRICT_ALL_TABLES"

# =====================================================
# MYSQL — CONFIG FILES & SERVICE
# =====================================================
percona_config_file:          /etc/mysql/mysql.conf.d/mysqld.cnf
percona_config_include_dir:   /etc/mysql/conf.d
percona_config_include_files: []
percona_daemon:               mysql
percona_pid_file:             /var/run/mysqld/mysqld.pid
percona_log_error:            /var/log/mysql/error.log
percona_log:                  ""
percona_service_name:         mysql

# =====================================================
# MYSQL — SERVER IDENTITY
# Override percona_server_id per play in playbook.yml
# Master play: percona_server_id: "1"
# Slave play:  percona_server_id: "2"
# =====================================================
percona_server_id: "1"

# =====================================================
# MYSQL — ROOT CREDENTIALS
# Override via Ansible Vault or Semaphore env var
# VAULT_MYSQL_ROOT_PASSWORD
# =====================================================
percona_root_username: "root"
percona_root_password: "changeme"

# =====================================================
# MYSQL — REPLICATION & BINLOG
# =====================================================
percona_gtid_mode:                  true
percona_binlog_format:              "ROW"
percona_max_binlog_size:            "100M"
percona_binlog_expire_logs_seconds: 604800   # 7 days — prevents error 1236

# =====================================================
# MYSQL — SLOW QUERY LOG
# =====================================================
percona_slow_query_log_enabled: true
percona_slow_query_time:        "2"
percona_slow_query_log_file:    /var/log/mysql-slow.log

# =====================================================
# MYSQL — MEMORY SETTINGS
# Auto-calculated based on system RAM (ansible_memtotal_mb)
# Falls back to safe defaults if facts unavailable
#
# T-Shirt sizing reference:
#   S  (~2GB  RAM) → dev/test
#   M  (~4GB  RAM) → staging
#   L  (~8GB  RAM) → production
#   XL (~16GB RAM) → high traffic
#
# Override in vars/vars.yml if auto-calc not suitable:
#   percona_innodb_buffer_pool_size: "4G"
#   percona_max_connections:         "500"
# =====================================================

# InnoDB buffer pool = 70% of total RAM (min 128M)
percona_innodb_buffer_pool_size: >-
  {{ [((ansible_memtotal_mb | default(512)) * 0.70) | int, 128] | max }}M

# InnoDB log file = 25% of buffer pool (min 64M)
percona_innodb_log_file_size: >-
  {{ [((ansible_memtotal_mb | default(512)) * 0.175) | int, 64] | max }}M

# InnoDB log buffer = 2% of RAM (min 8M)
percona_innodb_log_buffer_size: >-
  {{ [((ansible_memtotal_mb | default(512)) * 0.02) | int, 8] | max }}M

# Max connections = 20% of RAM in MB (min 50)
percona_max_connections: >-
  {{ [((ansible_memtotal_mb | default(512)) * 0.20) | int, 50] | max }}

# Thread cache = connections/4 (min 8, max 64)
percona_thread_cache_size: >-
  {{ [[((ansible_memtotal_mb | default(512)) * 0.05) | int, 8] | max, 64] | min }}

# Tmp table size = 5% of RAM (min 16M, max 256M)
percona_tmp_table_size: >-
  {{ [[((ansible_memtotal_mb | default(512)) * 0.05) | int, 16] | max, 256] | min }}M

# Max heap = same as tmp table size
percona_max_heap_table_size: "{{ percona_tmp_table_size }}"

# Sort buffer = 1% of RAM (min 1M, max 16M)
percona_sort_buffer_size: >-
  {{ [[((ansible_memtotal_mb | default(512)) * 0.01) | int, 1] | max, 16] | min }}M

# Read buffer = 0.5% of RAM (min 1M, max 8M)
percona_read_buffer_size: >-
  {{ [[((ansible_memtotal_mb | default(512)) * 0.005) | int, 1] | max, 8] | min }}M

# Read RND buffer = 1% of RAM (min 4M, max 32M)
percona_read_rnd_buffer_size: >-
  {{ [[((ansible_memtotal_mb | default(512)) * 0.01) | int, 4] | max, 32] | min }}M

# Join buffer = 1% of RAM in bytes (min 256K, max 8M)
percona_join_buffer_size: >-
  {{ [[((ansible_memtotal_mb | default(512)) * 0.01 * 1024 * 1024) | int, 262144] | max, 8388608] | min }}

# Table open cache = max_connections * 2 (min 256)
percona_table_open_cache: >-
  {{ [percona_max_connections | int * 2, 256] | max }}

# Key buffer (MyISAM) = 5% of RAM (min 64M, max 256M)
percona_key_buffer_size: >-
  {{ [[((ansible_memtotal_mb | default(512)) * 0.05) | int, 64] | max, 256] | min }}M

# =====================================================
# MYSQL — FIXED MEMORY SETTINGS
# Not RAM dependent — safe for all sizes
# =====================================================
percona_max_allowed_packet:           "64M"
percona_myisam_sort_buffer_size:      "64M"
percona_group_concat_max_len:         "1024"
percona_mysqldump_max_allowed_packet: "64M"

# =====================================================
# MYSQL — OTHER SETTINGS
# =====================================================
percona_lower_case_table_names: "0"
percona_wait_timeout:           "28800"
percona_event_scheduler_state:  "OFF"

# =====================================================
# MYSQL — INNODB SETTINGS (FIXED)
# =====================================================
percona_innodb_file_per_table:          "1"
percona_innodb_flush_log_at_trx_commit: "1"
percona_innodb_lock_wait_timeout:       "50"

# =====================================================
# MYSQL — DATABASES & USERS
# Override in group_vars or vars/vars.yml
# =====================================================
percona_databases: []
percona_users:
  - name:     mysqld_exporter
    host:     "localhost"
    password: "{{ percona_exporter_db_password }}"
    priv:     "*.*:PROCESS,REPLICATION CLIENT,SELECT"

# =====================================================
# MYSQL — LEGACY REPLICATION USER (non-HA)
# =====================================================
percona_replication_user:
  name:     "slave"
  password: "changeme"

percona_backup_user:
  name:     "backup"
  password: "changeme"

# =====================================================
# MYSQLD_EXPORTER — PROMETHEUS METRICS
# Override percona_exporter_db_password via Vault
# =====================================================
percona_exporter_version:     "0.15.1"
percona_exporter_user:        mysqld_exporter
percona_exporter_port:        9104
percona_exporter_db_user:     mysqld_exporter
percona_exporter_db_password: "changeme"

# =============================================================================
# HA — REPLICATION USER
# Override password via: VAULT_REPL_PASSWORD
# =============================================================================
percona_ha_replication_user:
  name:     "repl"
  password: "changeme"
  priv:     "*.*:REPLICATION SLAVE"

# =============================================================================
# HA — ORCHESTRATOR TOPOLOGY USER
# Override password via: VAULT_ORC_PASSWORD
# =============================================================================
percona_ha_orchestrator_topology_user:
  name:     "orchestrator"
  password: "changeme"

# =============================================================================
# HA — ORCHESTRATOR BACKEND DB USER
# Override password via: VAULT_ORC_SRV_PASSWORD
# =============================================================================
percona_ha_orchestrator_backend_user:
  name:     "orchestrator_srv"
  password: "changeme"
  database: "orchestrator"

# =============================================================================
# HA — APPLICATION USER (ProxySQL)
# Override password via: VAULT_APP_PASSWORD
# =============================================================================
percona_ha_app_user:
  name:                   "appuser"
  password:               "changeme"
  host:                   "%"
  default_hostgroup:      10
  transaction_persistent: 1
  max_connections:        100
  active:                 1

# =============================================================================
# HA — ORCHESTRATOR SETTINGS
# =============================================================================
percona_ha_orchestrator_version:      "3.2.6"
percona_ha_orchestrator_port:         3000
percona_ha_orchestrator_install_path: "/usr/local/orchestrator"
percona_ha_orchestrator_config_file:  "/etc/orchestrator.conf.json"
percona_ha_orchestrator_log_file:     "/usr/local/orchestrator/failover.log"
percona_ha_orchestrator_alert_log:    "/usr/local/orchestrator/alerts.log"
percona_ha_orchestrator_debug:        false
percona_ha_orchestrator_host:         ""

# =====================================================
# HA — ORCHESTRATOR DERIVED SETTINGS
# =====================================================
percona_ha_orchestrator_binary:       "{{ percona_ha_orchestrator_install_path }}/orchestrator"
percona_ha_orchestrator_service_name: "orchestrator"
percona_ha_orchestrator_service_file: "/etc/systemd/system/orchestrator.service"
percona_ha_orchestrator_tmp_archive:  "/tmp/orchestrator.tar.gz"
percona_ha_orchestrator_download_url: "https://github.com/openark/orchestrator/releases/download/v{{ percona_ha_orchestrator_version }}/orchestrator-{{ percona_ha_orchestrator_version }}-linux-amd64.tar.gz"

# =====================================================
# HA — ORCHESTRATOR POLLING & DETECTION
# =====================================================
percona_ha_orchestrator_instance_poll_seconds:              5
percona_ha_orchestrator_recovery_poll_seconds:              2
percona_ha_orchestrator_recovery_period_block_seconds:      0
percona_ha_orchestrator_detection_sampling_size:            5
percona_ha_orchestrator_connect_timeout_seconds:            5
percona_ha_orchestrator_read_timeout_seconds:               30
percona_ha_orchestrator_reasonable_replication_lag_seconds: 10
percona_ha_orchestrator_max_replicas_to_render:             5

# =====================================================
# HA — ORCHESTRATOR RECOVERY
# =====================================================
percona_ha_orchestrator_recovery_enabled:                    true
percona_ha_orchestrator_recover_master_filters:              ["*"]
percona_ha_orchestrator_recover_intermediate_master_filters: ["*"]
percona_ha_orchestrator_fail_master_if_sql_not_uptodate:     false
percona_ha_orchestrator_detach_lost_replicas_after_failover: true
percona_ha_orchestrator_hostname_resolve_method:             "none"
percona_ha_orchestrator_mysql_hostname_resolve_method:       "none"
percona_ha_orchestrator_reject_hostname_pattern:             ""

# =============================================================================
# HA — PROXYSQL SETTINGS
# Override percona_ha_proxysql_admin_password via: VAULT_PROXYSQL_PASSWORD
# =============================================================================
percona_ha_proxysql_version:                "2.5.5"
percona_ha_proxysql_port:                   6033
percona_ha_proxysql_admin_port:             6032
percona_ha_proxysql_admin_user:             "admin"
percona_ha_proxysql_admin_password:         "changeme"
percona_ha_proxysql_datadir:                "/var/lib/proxysql"
percona_ha_proxysql_writer_hostgroup:       10
percona_ha_proxysql_reader_hostgroup:       20
percona_ha_proxysql_master_max_connections: 200
percona_ha_proxysql_slave_max_connections:  100
percona_ha_proxysql_max_replication_lag:    10
percona_ha_proxysql_download_url:           "https://github.com/sysown/proxysql/releases/download/v2.5.5/proxysql_2.5.5-ubuntu20_amd64.deb"
percona_ha_proxysql_tmp_package:            "/tmp/proxysql.deb"
percona_ha_proxysql_pid_file:               "/var/lib/proxysql/proxysql.pid"
percona_ha_proxysql_service_name:           "proxysql"

# =====================================================
# HA — PROXYSQL QUERY RULES (10 production rules)
# writer hostgroup = 10 | reader hostgroup = 20
# =====================================================
percona_ha_proxysql_query_rules:
  - rule_id: 1
    active: 1
    match_pattern: "^SELECT.*FOR UPDATE"
    destination_hostgroup: 10
    apply: 1
    comment: "Locking reads to master"
  - rule_id: 2
    active: 1
    match_pattern: "^SELECT.*LOCK IN SHARE MODE"
    destination_hostgroup: 10
    apply: 1
    comment: "Lock share mode to master"
  - rule_id: 3
    active: 1
    match_pattern: "^SELECT.*INTO"
    destination_hostgroup: 10
    apply: 1
    comment: "SELECT INTO to master"
  - rule_id: 4
    active: 1
    match_pattern: "^SELECT"
    destination_hostgroup: 20
    apply: 1
    comment: "Regular reads to replicas"
  - rule_id: 5
    active: 1
    match_pattern: "^SHOW"
    destination_hostgroup: 10
    apply: 1
    comment: "SHOW commands to master"
  - rule_id: 6
    active: 1
    match_pattern: "^SET"
    destination_hostgroup: 10
    apply: 1
    comment: "SET commands to master"
  - rule_id: 7
    active: 1
    match_pattern: "^BEGIN"
    destination_hostgroup: 10
    apply: 1
    comment: "Transactions to master"
  - rule_id: 8
    active: 1
    match_pattern: "^COMMIT"
    destination_hostgroup: 10
    apply: 1
    comment: "Commit to master"
  - rule_id: 9
    active: 1
    match_pattern: "^ROLLBACK"
    destination_hostgroup: 10
    apply: 1
    comment: "Rollback to master"
  - rule_id: 10
    active: 1
    match_pattern: "^CALL"
    destination_hostgroup: 10
    apply: 1
    comment: "Stored procedures to master"

# =============================================================================
# HA — MINIO CLIENT SETTINGS
# Override endpoint and password via: VAULT_MINIO_PASSWORD
# =============================================================================
percona_ha_mc_install_path:     "/usr/local/bin/mc"
percona_ha_minio_alias:         "companyminio"
percona_ha_minio_endpoint:      "https://minio.example.com:9000"
percona_ha_minio_root_user:     "minioadmin"
percona_ha_minio_root_password: "changeme"
percona_ha_minio_bucket:        "percona-backup"
percona_ha_minio_full_folder:   "full"
percona_ha_minio_inc_folder:    "incremental"
percona_ha_minio_resync_folder: "failover-resync"

# =============================================================================
# HA — MINIO SERVER SETTINGS
# =============================================================================
percona_ha_minio_system_user:   "minio"
percona_ha_minio_install_path:  "/usr/local/bin/minio"
percona_ha_minio_datadir:       "/data/minio"
percona_ha_minio_port:          9000
percona_ha_minio_console_port:  8443

# =====================================================
# HA — BACKUP STORAGE TYPE
# Options: minio | local
# minio — streams backup directly to MinIO (no local disk)
# local — stores backup on local disk
# =====================================================
percona_ha_backup_storage: "minio"

# =====================================================
# HA — LOCAL BACKUP SETTINGS
# Used only when percona_ha_backup_storage: local
# =====================================================
percona_ha_local_backup_path:  "/var/backup/mysql"
percona_ha_local_backup_owner: "root"
percona_ha_local_backup_group: "root"
percona_ha_local_backup_mode:  "0750"

# =====================================================
# HA — BACKUP SETTINGS
# =====================================================
percona_ha_backup_log_file:             "/var/log/mysql-backup.log"
percona_ha_backup_lsn_file:             "/var/lib/mysql-backup/last_lsn"
percona_ha_backup_scripts_path:         "/usr/local/bin"
percona_ha_xtrabackup_parallel:         4
percona_ha_xtrabackup_compress_threads: 4

# =====================================================
# HA — BACKUP CRON SCHEDULE
# =====================================================
percona_ha_backup_full_cron_minute:  "0"
percona_ha_backup_full_cron_hour:    "1"
percona_ha_backup_full_cron_weekday: "0"
percona_ha_backup_inc_cron_minute:   "0"
percona_ha_backup_inc_cron_hour:     "1"
percona_ha_backup_inc_cron_weekday:  "1-6"

# =====================================================
# HA — BACKUP RETENTION POLICY
# =====================================================
percona_ha_backup_full_retention_days: 30
percona_ha_backup_inc_retention_days:  7

# =============================================================================
# HA — POST-FAILOVER SCRIPT SETTINGS
# =============================================================================
percona_ha_failover_ssh_user:         "ubuntu"
percona_ha_failover_script_path:      "/usr/local/orchestrator/post-failover-action.sh"
percona_ha_failover_max_restart_wait: 900
percona_ha_failover_retry_interval:   30

# =====================================================
# HA — SEMAPHORE INTEGRATION
# =====================================================
percona_ha_semaphore_url:              "https://semaphore.example.com"
percona_ha_semaphore_restore_template: "Percona-Restore"

# =====================================================
# HA — NOTIFICATIONS
# Leave empty to disable
# =====================================================
percona_ha_slack_webhook_url: ""
percona_ha_alert_email:       ""

# =====================================================
# HA — MASTER IP
# Used by post-failover script — override per environment
# =====================================================
percona_ha_mysql_master_ip: ""

# =============================================================================
# HA — PMM MONITORING
# Override via: VAULT_PMM_PASSWORD
# =============================================================================
percona_ha_pmm_server_url:         "https://pmm.example.com"
percona_ha_pmm_server_url_encoded: "https://admin:changeme@pmm.example.com"
percona_ha_pmm_username:           "admin"
percona_ha_pmm_password:           "changeme"
percona_ha_pmm_client_version:     "3.5.0-7.noble"
