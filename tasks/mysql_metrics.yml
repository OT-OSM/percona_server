---
- name: Create mysqld_exporter system user
  ansible.builtin.user:
    name:   "{{ percona_exporter_user }}"
    system: true
    shell:  /usr/sbin/nologin
  tags: mysql_metrics

- name: Download mysqld_exporter
  ansible.builtin.unarchive:
    src:        "https://github.com/prometheus/mysqld_exporter/releases/download/v{{ percona_exporter_version }}/mysqld_exporter-{{ percona_exporter_version }}.linux-amd64.tar.gz"
    dest:       /tmp
    remote_src: true
  tags: mysql_metrics

- name: Install mysqld_exporter binary
  ansible.builtin.copy:
    src:        "/tmp/mysqld_exporter-{{ percona_exporter_version }}.linux-amd64/mysqld_exporter"
    dest:       /usr/local/bin/mysqld_exporter
    mode:       "0755"
    owner:      root
    group:      root
    remote_src: true
  tags: mysql_metrics

- name: Create exporter config directory
  ansible.builtin.file:
    path:  /etc/mysqld_exporter
    state: directory
    owner: "{{ percona_exporter_user }}"
    group: "{{ percona_exporter_user }}"
    mode:  "0700"
  tags: mysql_metrics

- name: Render exporter credentials file
  ansible.builtin.template:
    src:   exporter.cnf.j2
    dest:  /etc/mysqld_exporter/.my.cnf
    owner: "{{ percona_exporter_user }}"
    group: "{{ percona_exporter_user }}"
    mode:  "0600"
  tags: mysql_metrics

- name: Deploy mysqld_exporter systemd service
  ansible.builtin.template:
    src:   mysqld_exporter.service.j2
    dest:  /etc/systemd/system/mysqld_exporter.service
    owner: root
    group: root
    mode:  "0644"
  notify: Reload systemd
  tags: mysql_metrics

- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers
  tags: mysql_metrics

- name: Enable and start mysqld_exporter
  ansible.builtin.service:
    name:    mysqld_exporter
    state:   started
    enabled: true
  tags: mysql_metrics
