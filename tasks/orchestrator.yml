# =============================================================================
# Orchestrator — Installation + Configuration
# =============================================================================
# NOTE: MySQL server is installed on orchestrator node
# Orchestrator backend DB runs on localhost (same as prod setup)
# percona_install_packages: true in playbook-test.yml orchestrator play
# =============================================================================

# =====================================================
# INSTALLATION
# Archive structure: ./usr/local/orchestrator/orchestrator
# Strip 4 components to extract binary directly to install path
# =====================================================
- name: Create orchestrator install directory
  ansible.builtin.file:
    path:  "{{ percona_ha_orchestrator_install_path }}"
    state: directory
    owner: root
    group: root
    mode:  "0755"

- name: Check if orchestrator binary already exists
  ansible.builtin.stat:
    path: "{{ percona_ha_orchestrator_binary }}"
  register: orchestrator_binary_stat

- name: Download orchestrator archive
  ansible.builtin.get_url:
    url:  "{{ percona_ha_orchestrator_download_url }}"
    dest: "{{ percona_ha_orchestrator_tmp_archive }}"
    mode: "0644"
  when: not orchestrator_binary_stat.stat.exists

- name: Extract orchestrator archive
  ansible.builtin.unarchive:
    src:        "{{ percona_ha_orchestrator_tmp_archive }}"
    dest:       "{{ percona_ha_orchestrator_install_path }}"
    remote_src: true
    extra_opts: ['--strip-components=4']
  when: not orchestrator_binary_stat.stat.exists

- name: Ensure orchestrator binary is executable
  ansible.builtin.file:
    path:  "{{ percona_ha_orchestrator_binary }}"
    mode:  "0755"
    owner: root
    group: root

- name: Create orchestrator log file
  ansible.builtin.file:
    path:              "{{ percona_ha_orchestrator_log_file }}"
    state:             touch
    owner:             root
    group:             root
    mode:              "0666"
    modification_time: preserve
    access_time:       preserve

- name: Create orchestrator alert log file
  ansible.builtin.file:
    path:              "{{ percona_ha_orchestrator_alert_log }}"
    state:             touch
    owner:             root
    group:             root
    mode:              "0666"
    modification_time: preserve
    access_time:       preserve

- name: Deploy orchestrator systemd service file
  ansible.builtin.template:
    src:   orchestrator.service.j2
    dest:  "{{ percona_ha_orchestrator_service_file }}"
    owner: root
    group: root
    mode:  "0644"
  notify: Reload systemd

- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers

# =====================================================
# CONFIGURATION
# Backend DB on localhost — MySQL runs on orchestrator node
# Same as prod setup (192.168.8.12 has MySQL)
# =====================================================
- name: Create orchestrator backend database
  community.mysql.mysql_db:
    name:           "{{ percona_ha_orchestrator_backend_user.database }}"
    login_user:     "{{ percona_root_username }}"
    login_password: "{{ percona_root_password }}"
    login_host:     "127.0.0.1"
    login_port:     "{{ percona_port }}"
    state:          present

- name: Create orchestrator backend DB user
  community.mysql.mysql_user:
    name:           "{{ percona_ha_orchestrator_backend_user.name }}"
    host:           "localhost"
    password:       "{{ percona_ha_orchestrator_backend_user.password }}"
    priv:           "{{ percona_ha_orchestrator_backend_user.database }}.*:ALL"
    login_user:     "{{ percona_root_username }}"
    login_password: "{{ percona_root_password }}"
    login_host:     "127.0.0.1"
    login_port:     "{{ percona_port }}"
    state:          present
  no_log: true

- name: Deploy orchestrator configuration file
  ansible.builtin.template:
    src:   orchestrator.conf.json.j2
    dest:  "{{ percona_ha_orchestrator_config_file }}"
    owner: root
    group: root
    mode:  "0640"
  notify: restart_orchestrator

- name: Flush handlers to apply config
  ansible.builtin.meta: flush_handlers

- name: Enable orchestrator service
  ansible.builtin.service:
    name:    "{{ percona_ha_orchestrator_service_name }}"
    enabled: true

- name: Ensure orchestrator service is started
  ansible.builtin.service:
    name:  "{{ percona_ha_orchestrator_service_name }}"
    state: started

- name: Wait for orchestrator API to be ready
  ansible.builtin.wait_for:
    host:    127.0.0.1
    port:    "{{ percona_ha_orchestrator_port }}"
    timeout: 120
    delay:   5

- name: Discover master node in orchestrator
  ansible.builtin.uri:
    url: >-
      http://localhost:{{ percona_ha_orchestrator_port }}/api/discover/{{
      hostvars[groups[percona_master_group][0]]['ansible_default_ipv4']['address']
      }}/{{ percona_port }}
    method:      GET
    status_code: 200
  register: orchestrator_discover
  retries:  5
  delay:    5
  until:    orchestrator_discover.status == 200
  failed_when: false
