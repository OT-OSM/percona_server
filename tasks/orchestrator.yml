# =============================================================================
# Orchestrator Installation
# Archive structure: ./usr/local/orchestrator/orchestrator
# Strip 4 components to extract binary directly to install path
# =============================================================================
- name: Create orchestrator install directory
  ansible.builtin.file:
    path:  "{{ percona_ha_orchestrator_install_path }}"
    state: directory
    owner: root
    group: root
    mode:  "0755"

- name: Check if orchestrator binary already exists
  ansible.builtin.stat:
    path: "{{ orchestrator_binary }}"
  register: orchestrator_binary_stat

- name: Download orchestrator archive
  ansible.builtin.get_url:
    url:  "{{ orchestrator_download_url }}"
    dest: "{{ orchestrator_tmp_archive }}"
    mode: "0644"
  when: not orchestrator_binary_stat.stat.exists

- name: Extract orchestrator archive
  ansible.builtin.unarchive:
    src:        "{{ orchestrator_tmp_archive }}"
    dest:       "{{ percona_ha_orchestrator_install_path }}"
    remote_src: true
    extra_opts: ['--strip-components=4']
  when: not orchestrator_binary_stat.stat.exists

- name: Ensure orchestrator binary is executable
  ansible.builtin.file:
    path:  "{{ orchestrator_binary }}"
    mode:  "0755"
    owner: root
    group: root

- name: Create orchestrator log file
  ansible.builtin.file:
    path:              "{{ percona_ha_orchestrator_log_file }}"
    state:             touch
    owner:             root
    group:             root
    mode:              "0666"
    modification_time: preserve
    access_time:       preserve

- name: Create orchestrator alert log file
  ansible.builtin.file:
    path:              "{{ percona_ha_orchestrator_alert_log }}"
    state:             touch
    owner:             root
    group:             root
    mode:              "0666"
    modification_time: preserve
    access_time:       preserve

- name: Deploy orchestrator systemd service file
  ansible.builtin.template:
    src:   orchestrator.service.j2
    dest:  "{{ orchestrator_service_file }}"
    owner: root
    group: root
    mode:  "0644"
  notify: Reload systemd

- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers
