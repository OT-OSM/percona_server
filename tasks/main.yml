---
# ########################### #
# Percona Server Installation #
# ########################### #
- name: Including tasks for Installation of Percona
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"

# ############################ #
# Percona Server Configuration #
# ############################ #
- name: Including tasks for Configuring MySQL
  ansible.builtin.include_tasks: configure.yml

- name: Including tasks to Secure MySQL Installation
  ansible.builtin.include_tasks: secure-installation.yml

# ############################# #
# Percona Cluster Configuration #
# ############################# #
- name: Including tasks to Replication Setup
  ansible.builtin.include_tasks: replication.yml
  when: percona_replication | default(false)

# ################################### #
# Percona Backup Server Configuration #
# ################################### #
- name: Including tasks to Backup Server Setup
  ansible.builtin.include_tasks: backup.yml
  when: percona_backup | default(false)

# ############################# #
# Percona User and DB Operation #
# ############################# #
- name: Including tasks to database creation
  ansible.builtin.include_tasks: database.yml
  when: percona_database_creation | default(true)

- name: Including tasks to user creation
  ansible.builtin.include_tasks: users.yml
  tags:
    - create_user
  when: percona_users_creation | default(true)

- name: Including tasks to exporter metrics
  ansible.builtin.include_tasks: mysql_metrics.yml
  tags:
    - mysql_metrics
  when: percona_metrics_enabled | default(true)

# ################################## #
# HA — Replication Users Setup       #
# ################################## #
- name: Including tasks for HA Replication Users Setup
  ansible.builtin.include_tasks: replication_users.yml
  tags:
    - replication_users
  when:
    - percona_configure_replication_users | default(false)
    - inventory_hostname in groups[percona_master_group] | default([])

# ################################## #
# HA — Orchestrator                  #
# Install + Configure                #
# Runs only on orchestrator group    #
# ################################## #
- name: Including tasks for Orchestrator Installation and Configuration
  ansible.builtin.include_tasks: orchestrator.yml
  when:
    - percona_orchestrator_install | default(false) or
      percona_orchestrator_configure | default(false)
    - inventory_hostname in groups[percona_orchestrator_group] | default([])

# ################################## #
# HA — ProxySQL Installation         #
# Runs only on orchestrator group    #
# ################################## #
- name: Including tasks for ProxySQL Installation
  ansible.builtin.include_tasks: proxysql.yml
  when:
    - percona_proxysql_install | default(false)
    - inventory_hostname in groups[percona_orchestrator_group] | default([])

# ################################## #
# HA — ProxySQL Configuration        #
# Runs only on orchestrator group    #
# ################################## #
- name: Including tasks for ProxySQL Configuration
  ansible.builtin.include_tasks: proxysql_configure.yml
  when:
    - percona_proxysql_configure | default(false)
    - inventory_hostname in groups[percona_orchestrator_group] | default([])

# ################################## #
# HA — MinIO Client                  #
# Install mc on ALL MySQL nodes      #
# Required for backup and restore    #
# ################################## #
- name: Including tasks for MinIO Client Installation
  ansible.builtin.include_tasks: minio.yml
  when: >
    percona_minio_configure | default(false) or
    percona_deploy_backup_scripts | default(false) or
    percona_configure_replication_users | default(false) or
    percona_backup_server | default(false)

# ################################## #
# HA — Post-Failover Script          #
# Runs only on orchestrator group    #
# ################################## #
- name: Including tasks for Post-Failover Script
  ansible.builtin.include_tasks: post_failover_script.yml
  tags:
    - failover_script
  when:
    - percona_deploy_failover_script | default(false)
    - inventory_hostname in groups[percona_orchestrator_group] | default([])

# ################################## #
# HA — Backup Scripts                #
# Install on backup server or when   #
# deploy_backup_scripts is true      #
# ################################## #
- name: Including tasks for HA Backup Scripts
  ansible.builtin.include_tasks: backup_scripts.yml
  tags:
    - backup_scripts
  when: >
    percona_deploy_backup_scripts | default(false) or
    percona_backup_server | default(false)

# ################################## #
# HA — PMM Monitoring Setup          #
# ################################## #
- name: Including tasks for PMM Monitoring Setup
  ansible.builtin.include_tasks: pmm.yml
  tags:
    - pmm
  when: percona_pmm_enabled | default(false)
