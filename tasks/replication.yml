# =============================================================================
# Replication Setup — GTID / Binlog Based
# =============================================================================

- name: Set master address fact
  ansible.builtin.set_fact:
    percona_master_address: >-
      {{ hostvars[groups[percona_master_group][0]]['ansible_default_ipv4']['address'] }}
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_master_group]

# =============================================================================
# Create Replication User On Master
# =============================================================================

- name: Ensure replication user exists on master
  community.mysql.mysql_user:
    name:           "{{ percona_ha_replication_user.name }}"
    host:           "%"
    password:       "{{ percona_ha_replication_user.password }}"
    login_user:     "{{ percona_root_username }}"
    login_password: "{{ percona_root_password }}"
    login_host:     "127.0.0.1"
    login_port:     "{{ percona_port }}"
    priv:           "{{ percona_ha_replication_user.priv | default('*.*:REPLICATION SLAVE,REPLICATION CLIENT') }}"
    state:          present
  no_log: true
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_master_group]
    - percona_ha_replication_user.name is defined

# =============================================================================
# Get Master Binary Log Information
# =============================================================================

- name: Get master binary log status
  community.mysql.mysql_replication:
    mode:           getprimary
    login_user:     "{{ percona_root_username }}"
    login_password: "{{ percona_root_password }}"
    login_host:     "127.0.0.1"
    login_port:     "{{ percona_port }}"
  register: percona_master_status
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_master_group]

# =============================================================================
# Store Master Information
# =============================================================================

- name: Store master replication information
  ansible.builtin.set_fact:
    percona_master_binlog_file: "{{ percona_master_status.File }}"
    percona_master_binlog_pos:  "{{ percona_master_status.Position }}"
    percona_master_ip: >-
      {{ hostvars[groups[percona_master_group][0]]['ansible_default_ipv4']['address'] }}
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_master_group]

# =============================================================================
# Resolve Master Information On Replicas
# =============================================================================

- name: Resolve master replication information
  ansible.builtin.set_fact:
    resolved_percona_master_ip: >-
      {{ hostvars[groups[percona_master_group][0]]['percona_master_ip']
      | default(hostvars[groups[percona_master_group][0]]['ansible_default_ipv4']['address']) }}

    resolved_percona_master_binlog_file: >-
      {{ hostvars[groups[percona_master_group][0]]['percona_master_binlog_file']
      | default('') }}

    resolved_percona_master_binlog_pos: >-
      {{ hostvars[groups[percona_master_group][0]]['percona_master_binlog_pos']
      | default(0) }}
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_slave_group]

# =============================================================================
# Check Existing Replica Status
# =============================================================================

- name: Check current replica status
  community.mysql.mysql_replication:
    mode:           getreplica
    login_user:     "{{ percona_root_username }}"
    login_password: "{{ percona_root_password }}"
    login_host:     "127.0.0.1"
    login_port:     "{{ percona_port }}"
  register: percona_slave_status
  failed_when: false
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_slave_group]

# =============================================================================
# Debug — Show Replication Variables Before Configure
# =============================================================================

- name: Debug replication variables
  ansible.builtin.debug:
    msg:
      - "inventory_hostname:    {{ inventory_hostname }}"
      - "percona_slave_group:   {{ percona_slave_group }}"
      - "in slave group:        {{ inventory_hostname in groups[percona_slave_group] | default([]) }}"
      - "master IP resolved:    {{ resolved_percona_master_ip | default('NOT SET') }}"
      - "repl user:             {{ percona_ha_replication_user.name | default('NOT SET') }}"
      - "root user:             {{ percona_root_username }}"
      - "port:                  {{ percona_port }}"
      - "slave status defined:  {{ percona_slave_status is defined }}"
      - "Is_Replica:            {{ percona_slave_status.Is_Replica | default('NOT SET') }}"
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_slave_group]

# =============================================================================
# Configure Replica — GTID Based
# =============================================================================

- name: Configure replica using GTID
  community.mysql.mysql_replication:
    mode:                changeprimary
    primary_host:        "{{ resolved_percona_master_ip }}"
    primary_user:        "{{ percona_ha_replication_user.name }}"
    primary_password:    "{{ percona_ha_replication_user.password }}"
    primary_port:        "{{ percona_port }}"
    primary_auto_position: 1
    login_user:          "{{ percona_root_username }}"
    login_password:      "{{ percona_root_password }}"
    login_host:          "127.0.0.1"
    login_port:          "{{ percona_port }}"
  no_log: false
  register: percona_configure_replica_gtid
  failed_when:
    - percona_configure_replica_gtid is failed
    - "'already' not in (percona_configure_replica_gtid.msg | default(''))"
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_slave_group]
    - percona_gtid_mode | default(false) | bool
    - percona_ha_replication_user.name is defined
    - (percona_slave_status.Is_Replica is not defined)
      or
      (percona_slave_status.Is_Replica is defined
      and not percona_slave_status.Is_Replica)

# =============================================================================
# Configure Replica — Binlog Based
# =============================================================================

- name: Configure replica using binary logs
  community.mysql.mysql_replication:
    mode:             changeprimary
    primary_host:     "{{ resolved_percona_master_ip }}"
    primary_user:     "{{ percona_ha_replication_user.name }}"
    primary_password: "{{ percona_ha_replication_user.password }}"
    primary_port:     "{{ percona_port }}"
    primary_log_file: "{{ resolved_percona_master_binlog_file }}"
    primary_log_pos:  "{{ resolved_percona_master_binlog_pos }}"
    login_user:       "{{ percona_root_username }}"
    login_password:   "{{ percona_root_password }}"
    login_host:       "127.0.0.1"
    login_port:       "{{ percona_port }}"
  no_log: false
  register: percona_configure_replica
  failed_when:
    - percona_configure_replica is failed
    - "'already' not in (percona_configure_replica.msg | default(''))"
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_slave_group]
    - not percona_gtid_mode | default(false) | bool
    - percona_ha_replication_user.name is defined
    - (percona_slave_status.Is_Replica is not defined)
      or
      (percona_slave_status.Is_Replica is defined
      and not percona_slave_status.Is_Replica)

# =============================================================================
# Start Replica
# =============================================================================

- name: Start replica
  community.mysql.mysql_replication:
    mode:           startreplica
    login_user:     "{{ percona_root_username }}"
    login_password: "{{ percona_root_password }}"
    login_host:     "127.0.0.1"
    login_port:     "{{ percona_port }}"
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_slave_group]
    - (percona_slave_status.Is_Replica is not defined)
      or
      (percona_slave_status.Is_Replica is defined
      and not percona_slave_status.Is_Replica)

# =============================================================================
# Validate Replica Status
# =============================================================================

- name: Validate replica replication status
  community.mysql.mysql_replication:
    mode:           getreplica
    login_user:     "{{ percona_root_username }}"
    login_password: "{{ percona_root_password }}"
    login_host:     "127.0.0.1"
    login_port:     "{{ percona_port }}"
  register: percona_replica_validation
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_slave_group]

- name: Display replica replication status
  ansible.builtin.debug:
    var: percona_replica_validation
  when:
    - percona_replication | bool
    - inventory_hostname in groups[percona_slave_group]
