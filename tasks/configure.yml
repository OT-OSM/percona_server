# =============================================================================
# Percona Server Configuration + Secure Installation
# =============================================================================

# =====================================================
# SECTION 1 — MySQL Configuration
# =====================================================

- name: Get MySQL version
  ansible.builtin.command: mysql --version
  register: mysql_cli_version
  changed_when: false
  check_mode: false

- name: Copy percona global configuration file
  ansible.builtin.template:
    src:   mysqld.cnf.j2
    dest:  "{{ percona_config_file }}"
    owner: root
    group: root
    mode:  "0644"
  notify: restart_percona
  register: mysql_config

- name: Create slow query log file
  ansible.builtin.file:
    path:              "{{ percona_slow_query_log_file }}"
    state:             touch
    owner:             mysql
    group:             mysql
    mode:              "0640"
    modification_time: preserve
    access_time:       preserve
  when: percona_slow_query_log_enabled

- name: Create datadir of MySQL
  ansible.builtin.file:
    path:  "{{ percona_datadir }}"
    state: directory
    owner: mysql
    group: mysql
    mode:  "0755"

- name: Create error log file
  ansible.builtin.file:
    path:              "{{ percona_log_error }}"
    state:             touch
    owner:             mysql
    group:             mysql
    mode:              "0640"
    modification_time: preserve
    access_time:       preserve
  when:
    - percona_log | default(true)
    - percona_log_error | default(false)

- name: Ensure MySQL is started and enabled
  ansible.builtin.service:
    name:    "{{ percona_daemon }}"
    state:   started
    enabled: true
  register: mysql_service_configuration

- name: Flush handlers to apply config changes
  ansible.builtin.meta: flush_handlers

- name: Restart MySQL if config was updated
  ansible.builtin.service:
    name:  "{{ percona_daemon }}"
    state: restarted
  when: mysql_config is changed

# =====================================================
# SECTION 2 — Secure Installation
# =====================================================

# ── Step 1: Check root auth plugin ───────────────────────────────────────────
- name: Check root authentication plugin
  ansible.builtin.command: >
    mysql
    -u {{ percona_root_username }}
    --connect-timeout=10
    -NBe "SELECT plugin FROM mysql.user
          WHERE user='{{ percona_root_username }}'
          AND host='localhost';"
  register: root_auth_plugin
  changed_when: false
  failed_when: false
  no_log: true

- name: Show root auth plugin
  ansible.builtin.debug:
    msg: "Root auth plugin: {{ root_auth_plugin.stdout }}"

# ── Step 2: Set root password via socket if auth_socket ──────────────────────
- name: Set root password via socket — fresh install only
  ansible.builtin.command: >
    mysql
    -u {{ percona_root_username }}
    --connect-timeout=10
    -NBe "ALTER USER '{{ percona_root_username }}'@'localhost'
          IDENTIFIED WITH mysql_native_password
          BY '{{ percona_root_password }}';
          FLUSH PRIVILEGES;"
  changed_when: true
  no_log: true
  when:
    - root_auth_plugin.stdout == "auth_socket"

# ── Step 3: Verify password login works ──────────────────────────────────────
- name: Check MySQL login with password
  ansible.builtin.command: >
    mysql
    -u {{ percona_root_username }}
    -p{{ percona_root_password }}
    --protocol=TCP
    -h 127.0.0.1
    --connect-timeout=10
    -NBe "SELECT 1"
  register: mysql_login_check
  changed_when: false
  failed_when: false
  no_log: true

# ── Step 4: Secure installation tasks ────────────────────────────────────────
- name: Disallow root login remotely
  community.mysql.mysql_user:
    name:               "{{ percona_root_username }}"
    host:               "%"
    state:              absent
    login_user:         "{{ percona_root_username }}"
    login_password:     "{{ percona_root_password }}"
    login_host:         "127.0.0.1"
    login_port:         "{{ percona_port }}"
  when:
    - mysql_login_check.rc == 0
    - inventory_hostname in groups[percona_master_group] | default([])

- name: Get list of hosts for the anonymous user
  ansible.builtin.command: >
    mysql
    -u {{ percona_root_username }}
    -p{{ percona_root_password }}
    --protocol=TCP
    -h 127.0.0.1
    --connect-timeout=10
    -NBe 'SELECT Host FROM mysql.user WHERE User = ""'
  register: mysql_anonymous_hosts
  changed_when: false
  no_log: true
  when:
    - mysql_login_check.rc == 0
    - inventory_hostname in groups[percona_master_group] | default([])

- name: Remove anonymous MySQL users
  community.mysql.mysql_user:
    name:           ""
    host:           "{{ item }}"
    state:          absent
    login_user:     "{{ percona_root_username }}"
    login_password: "{{ percona_root_password }}"
    login_host:     "127.0.0.1"
    login_port:     "{{ percona_port }}"
  with_items: "{{ mysql_anonymous_hosts.stdout_lines | default([]) }}"
  when:
    - mysql_login_check.rc == 0
    - inventory_hostname in groups[percona_master_group] | default([])

- name: Get list of hosts for the root user
  ansible.builtin.command: >
    mysql
    -u {{ percona_root_username }}
    -p{{ percona_root_password }}
    --protocol=TCP
    -h 127.0.0.1
    --connect-timeout=10
    -NBe "SELECT Host FROM mysql.user
    WHERE User = '{{ percona_root_username }}'
    ORDER BY (Host='localhost') ASC"
  register: mysql_root_hosts
  changed_when: false
  no_log: true
  when:
    - mysql_login_check.rc == 0
    - inventory_hostname not in groups[percona_slave_group] | default([])

- name: Ensure root password is set
  ansible.builtin.command:
    argv:
      - mysql
      - -u
      - "{{ percona_root_username }}"
      - "-p{{ percona_root_password }}"
      - --protocol=TCP
      - -h
      - "127.0.0.1"
      - --connect-timeout=10
      - -NBe
      - >-
        ALTER USER '{{ percona_root_username }}'@'{{ item }}'
        IDENTIFIED WITH caching_sha2_password
        BY '{{ percona_root_password }}';
  with_items: "{{ mysql_root_hosts.stdout_lines | default([]) }}"
  no_log: false
  changed_when: true
  when:
    - mysql_login_check.rc == 0
    - percona_install_packages | bool or percona_root_password_update
    - inventory_hostname not in groups[percona_slave_group] | default([])
