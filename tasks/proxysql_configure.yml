
# =============================================================================
# ProxySQL Configuration
# Uses mysql client directly on admin port 6032
# No community.proxysql collection required
# =============================================================================

- name: Define ProxySQL admin command
  ansible.builtin.set_fact:
    proxysql_admin_cmd: >-
      mysql
      -u {{ percona_ha_proxysql_admin_user }}
      -p{{ percona_ha_proxysql_admin_password }}
      -h 127.0.0.1
      -P {{ percona_ha_proxysql_admin_port }}

# =============================================================================
# Configure Replication Hostgroups
# =============================================================================

- name: Configure ProxySQL replication hostgroups
  ansible.builtin.command: >
    {{ proxysql_admin_cmd }}
    -e "
    REPLACE INTO mysql_replication_hostgroups
    (writer_hostgroup,reader_hostgroup,check_type,comment)
    VALUES(
      {{ percona_ha_proxysql_writer_hostgroup }},
      {{ percona_ha_proxysql_reader_hostgroup }},
      'read_only',
      'Percona HA Cluster'
    );"
  changed_when: false
  no_log: true
  when: percona_proxysql_configure | bool

# =============================================================================
# Configure Master Backend Server
# =============================================================================

- name: Configure ProxySQL backend master server
  ansible.builtin.command: >
    {{ proxysql_admin_cmd }}
    -e "
    REPLACE INTO mysql_servers
    (hostgroup_id,hostname,port,max_connections,status)
    VALUES(
      {{ percona_ha_proxysql_writer_hostgroup }},
      '{{ hostvars[groups[percona_master_group][0]]['ansible_default_ipv4']['address'] }}',
      {{ percona_port }},
      {{ percona_ha_proxysql_master_max_connections }},
      'ONLINE'
    );"
  changed_when: false
  no_log: true
  when: percona_proxysql_configure | bool

# =============================================================================
# Configure Replica Backend Servers
# =============================================================================

- name: Configure ProxySQL backend replica servers
  ansible.builtin.command: >
    {{ proxysql_admin_cmd }}
    -e "
    REPLACE INTO mysql_servers
    (hostgroup_id,hostname,port,max_connections,max_replication_lag,status)
    VALUES(
      {{ percona_ha_proxysql_reader_hostgroup }},
      '{{ hostvars[item]['ansible_default_ipv4']['address'] }}',
      {{ percona_port }},
      {{ percona_ha_proxysql_slave_max_connections }},
      {{ percona_ha_proxysql_max_replication_lag }},
      'ONLINE'
    );"
  changed_when: false
  no_log: true
  loop: "{{ groups[percona_slave_group] | default([]) }}"
  when: percona_proxysql_configure | bool

# =============================================================================
# Configure Application User
# =============================================================================

- name: Configure ProxySQL application user
  ansible.builtin.command: >
    {{ proxysql_admin_cmd }}
    -e "
    REPLACE INTO mysql_users
    (username,password,default_hostgroup,active,transaction_persistent,max_connections)
    VALUES(
      '{{ percona_ha_app_user.name }}',
      '{{ percona_ha_app_user.password }}',
      {{ percona_ha_app_user.default_hostgroup }},
      {{ percona_ha_app_user.active | default(1) }},
      {{ percona_ha_app_user.transaction_persistent | default(1) }},
      {{ percona_ha_app_user.max_connections | default(100) }}
    );"
  changed_when: false
  no_log: true
  when: percona_proxysql_configure | bool

# =============================================================================
# Configure Orchestrator Monitor User
# =============================================================================

- name: Configure ProxySQL orchestrator monitor user
  ansible.builtin.command: >
    {{ proxysql_admin_cmd }}
    -e "
    REPLACE INTO mysql_users
    (username,password,default_hostgroup,active,transaction_persistent,max_connections)
    VALUES(
      '{{ percona_ha_orchestrator_topology_user.name }}',
      '{{ percona_ha_orchestrator_topology_user.password }}',
      {{ percona_ha_proxysql_writer_hostgroup }},
      1,
      0,
      10
    );"
  changed_when: false
  no_log: true
  when: percona_proxysql_configure | bool

# =============================================================================
# Configure Query Rules
# =============================================================================

- name: Configure ProxySQL query rules
  ansible.builtin.command: >
    {{ proxysql_admin_cmd }}
    -e "
    REPLACE INTO mysql_query_rules
    (rule_id,active,match_pattern,destination_hostgroup,apply,comment)
    VALUES(
      {{ item.rule_id }},
      {{ item.active }},
      '{{ item.match_pattern }}',
      {{ item.destination_hostgroup }},
      {{ item.apply }},
      '{{ item.comment | default('') | replace(\"'\", \"''\") }}'
    );"
  changed_when: false
  no_log: true
  loop: "{{ percona_ha_proxysql_query_rules }}"
  when: percona_proxysql_configure | bool

# =============================================================================
# Configure Monitoring Credentials
# =============================================================================

- name: Configure ProxySQL monitoring credentials
  ansible.builtin.command: >
    {{ proxysql_admin_cmd }}
    -e "
    UPDATE global_variables
    SET variable_value='{{ percona_ha_orchestrator_topology_user.name }}'
    WHERE variable_name='mysql-monitor_username';

    UPDATE global_variables
    SET variable_value='{{ percona_ha_orchestrator_topology_user.password }}'
    WHERE variable_name='mysql-monitor_password';
    "
  changed_when: false
  no_log: true
  when: percona_proxysql_configure | bool

# =============================================================================
# Load Configuration To Runtime
# =============================================================================

- name: Load ProxySQL configuration to runtime
  ansible.builtin.command: >
    {{ proxysql_admin_cmd }}
    -e "
    LOAD MYSQL SERVERS TO RUNTIME;
    LOAD MYSQL USERS TO RUNTIME;
    LOAD MYSQL QUERY RULES TO RUNTIME;
    LOAD MYSQL VARIABLES TO RUNTIME;
    "
  changed_when: false
  no_log: true
  when: percona_proxysql_configure | bool

# =============================================================================
# Save Configuration To Disk
# =============================================================================

- name: Save ProxySQL configuration to disk
  ansible.builtin.command: >
    {{ proxysql_admin_cmd }}
    -e "
    SAVE MYSQL SERVERS TO DISK;
    SAVE MYSQL USERS TO DISK;
    SAVE MYSQL QUERY RULES TO DISK;
    SAVE MYSQL VARIABLES TO DISK;
    "
  changed_when: false
  no_log: true
  when: percona_proxysql_configure | bool

# =============================================================================
# Validation
# =============================================================================

- name: Validate ProxySQL backend servers
  ansible.builtin.command: >
    {{ proxysql_admin_cmd }}
    -e "SELECT hostgroup_id,hostname,status FROM mysql_servers;"
  changed_when: false
  register: proxysql_backend_validation
  when: percona_proxysql_configure | bool

- name: Display ProxySQL configured backend servers
  ansible.builtin.debug:
    var: proxysql_backend_validation.stdout_lines
  when: percona_proxysql_configure | bool

