---
percona_root_username: root
percona_root_password: ''
percona_socket: /var/run/mysqld/mysqld.sock
percona_port: 3306
percona_primary: db1
percona_address: '{{ ansible_host | default(inventory_hostname) }}'
percona_replication_user: repl
percona_replication_password: ''
percona_replication_tls: false
percona_replication_tls_ca: ''
percona_replica_seeded: false
percona_replication_retries: 12
percona_replication_delay: 5
