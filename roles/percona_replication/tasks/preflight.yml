---
- name: Validate replication inventory and credentials
  ansible.builtin.assert:
    that:
    - percona_primary in hostvars
    - percona_primary in groups['database'] | default([])
    - percona_replication_password | length >= 12
    - groups['replicas'] | default([]) | length > 0
    - groups['replicas'] | intersect([percona_primary]) | length == 0
    - not percona_replication_tls or percona_replication_tls_ca | length > 0
    fail_msg: Define percona_primary, database/replicas groups, one replication credential and explicit addresses.
- name: Inspect local replication prerequisites
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT @@gtid_mode AS gtid, @@log_bin AS binlog, @@log_replica_updates AS updates, @@read_only AS ro,
      @@super_read_only AS sro, @@server_uuid AS uuid, @@server_id AS sid, @@gtid_executed AS executed, @@gtid_purged
      AS purged
  changed_when: false
  register: replication_identity
- name: Require promotion-capable GTID nodes
  ansible.builtin.assert:
    that:
    - replication_identity.query_result[0][0].gtid == 'ON'
    - replication_identity.query_result[0][0].binlog | int == 1
    - replication_identity.query_result[0][0].updates | int == 1
    - replication_identity.query_result[0][0].ro | bool == (inventory_hostname != percona_primary)
    - replication_identity.query_result[0][0].sro | bool == (inventory_hostname != percona_primary)
    fail_msg: Configure the database baseline first. Reconcile topology after any promotion.
- name: Check existing replication channel
  community.mysql.mysql_replication:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    mode: getreplica
  register: replication_existing
  no_log: true
- name: Refuse ambiguous multi-source channels
  ansible.builtin.assert:
    that:
    - replication_existing.Channel_Name | default('') == ''
    fail_msg: This role supports a single unnamed replication channel.
- name: Require a top-level primary in this single-source topology
  ansible.builtin.assert:
    that:
    - not replication_existing.Is_Replica | default(false)
    fail_msg: The declared primary already replicates from another source; cascading topology is not managed here.
  when: inventory_hostname == percona_primary
