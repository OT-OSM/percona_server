---
- name: Require source facts in this same play
  ansible.builtin.assert:
    that:
    - hostvars[percona_primary].replication_identity is defined
    fail_msg: Run replication.yml on both primary and replicas; do not limit only to a replica.
- name: Ensure all database identities are unique
  ansible.builtin.assert:
    that:
    - groups['database'] | map('extract', hostvars, 'replication_identity') | map(attribute='query_result') | map('first')
      | map('first') | map(attribute='uuid') | unique | length == groups['database'] | length
    - groups['database'] | map('extract', hostvars, 'replication_identity') | map(attribute='query_result') | map('first')
      | map('first') | map(attribute='sid') | unique | length == groups['database'] | length
    fail_msg: Duplicate UUID/server_id detected; seed with a new replica UUID.
- name: Never silently change an existing source
  ansible.builtin.assert:
    that:
    - not replication_existing.Is_Replica | default(false) or replication_existing.Source_Host | default(replication_existing.Master_Host
      | default('')) == hostvars[percona_primary].percona_address
    - not replication_existing.Is_Replica | default(false) or replication_existing.Auto_Position | default(0) |
      int == 1
    - replication_existing.Is_Replica | default(false) or percona_replica_seeded | bool
    - not replication_existing.Is_Replica | default(false) or replication_existing.Source_Port | default(replication_existing.Master_Port
      | default(3306)) | int == hostvars[percona_primary].percona_port | default(3306) | int
    fail_msg: Existing source/GTID mode differs, or no seed acknowledgement. Restore and verify the replica before
      attaching.
  when: inventory_hostname != percona_primary
- name: Check history compatibility before first attachment
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT GTID_SUBSET(@@global.gtid_executed, %s) AS subset_ok, GTID_SUBSET(%s, @@global.gtid_executed)
      AS retained_ok
    positional_args:
    - '{{ hostvars[percona_primary].replication_identity.query_result[0][0].executed }}'
    - '{{ hostvars[percona_primary].replication_identity.query_result[0][0].purged }}'
  register: replication_history
  changed_when: false
  when: inventory_hostname != percona_primary and not replication_existing.Is_Replica | default(false)
- name: Reject errant GTIDs and missing purged history
  ansible.builtin.assert:
    that:
    - replication_history.query_result[0][0].subset_ok | int == 1
    - replication_history.query_result[0][0].retained_ok | int == 1
    fail_msg: GTID history is incompatible; reseed instead of resetting replication.
  when: inventory_hostname != percona_primary and not replication_existing.Is_Replica | default(false)
- name: Attach a verified seed without resetting existing channels
  community.mysql.mysql_replication:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    mode: changeprimary
    primary_host: '{{ hostvars[percona_primary].percona_address }}'
    primary_port: '{{ hostvars[percona_primary].percona_port | default(3306) }}'
    primary_user: '{{ percona_replication_user }}'
    primary_password: '{{ percona_replication_password }}'
    primary_auto_position: true
    primary_ssl: '{{ percona_replication_tls }}'
    primary_ssl_ca: '{{ percona_replication_tls_ca if percona_replication_tls else omit }}'
    primary_ssl_verify_server_cert: '{{ percona_replication_tls }}'
  when: inventory_hostname != percona_primary and not replication_existing.Is_Replica | default(false)
  no_log: true
- name: Stop threads briefly when managed replication credentials change
  community.mysql.mysql_replication:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    mode: stopreplica
  when: inventory_hostname != percona_primary and replication_existing.Is_Replica | default(false) and ((hostvars[percona_primary].replication_account.results
    | selectattr('changed', 'equalto', true) | list | length > 0) or ((replication_existing.Source_SSL_Allowed |
    default(replication_existing.Master_SSL_Allowed | default('No')) == 'Yes') != (percona_replication_tls | bool))
    or ((replication_existing.Source_SSL_CA_File | default(replication_existing.Master_SSL_CA_File | default('')))
    != percona_replication_tls_ca and percona_replication_tls | bool))
  no_log: true
- name: Update channel credentials without resetting its history
  community.mysql.mysql_replication:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    mode: changeprimary
    primary_user: '{{ percona_replication_user }}'
    primary_password: '{{ percona_replication_password }}'
    primary_ssl: '{{ percona_replication_tls }}'
    primary_ssl_ca: '{{ percona_replication_tls_ca if percona_replication_tls else omit }}'
    primary_ssl_verify_server_cert: '{{ percona_replication_tls }}'
  when: inventory_hostname != percona_primary and replication_existing.Is_Replica | default(false) and ((hostvars[percona_primary].replication_account.results
    | selectattr('changed', 'equalto', true) | list | length > 0) or ((replication_existing.Source_SSL_Allowed |
    default(replication_existing.Master_SSL_Allowed | default('No')) == 'Yes') != (percona_replication_tls | bool))
    or ((replication_existing.Source_SSL_CA_File | default(replication_existing.Master_SSL_CA_File | default('')))
    != percona_replication_tls_ca and percona_replication_tls | bool))
  no_log: true
- name: Start configured replication when either thread is stopped
  community.mysql.mysql_replication:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    mode: startreplica
  when: inventory_hostname != percona_primary and (replication_existing.Replica_IO_Running | default(replication_existing.Slave_IO_Running
    | default('No')) != 'Yes' or replication_existing.Replica_SQL_Running | default(replication_existing.Slave_SQL_Running
    | default('No')) != 'Yes') or (inventory_hostname != percona_primary and replication_existing.Is_Replica | default(false)
    and ((hostvars[percona_primary].replication_account.results | selectattr('changed', 'equalto', true) | list
    | length > 0) or ((replication_existing.Source_SSL_Allowed | default(replication_existing.Master_SSL_Allowed
    | default('No')) == 'Yes') != (percona_replication_tls | bool)) or ((replication_existing.Source_SSL_CA_File
    | default(replication_existing.Master_SSL_CA_File | default(''))) != percona_replication_tls_ca and percona_replication_tls
    | bool)))
  no_log: true
