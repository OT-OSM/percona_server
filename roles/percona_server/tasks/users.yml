---
- name: Manage explicitly listed application accounts
  community.mysql.mysql_user:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    name: '{{ item.name }}'
    host: '{{ item.host | default(''localhost'') }}'
    plugin: '{{ item.plugin | default(''caching_sha2_password'') }}'
    plugin_auth_string: '{{ item.password }}'
    salt: '{{ ((item.name ~ '':'' ~ (item.host | default(''localhost''))) | hash(''sha256''))[:20] if item.plugin
      | default(''caching_sha2_password'') == ''caching_sha2_password'' else omit }}'
    priv: '{{ item.priv }}'
    state: '{{ item.state | default(''present'') }}'
  loop: '{{ percona_users }}'
  no_log: true
