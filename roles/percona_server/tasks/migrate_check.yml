---
# Safety checks before turning a standalone server into a group seed.
# Fails with the exact problem; nothing is changed on the server.
- name: Read GTID and binlog format
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT @@global.gtid_mode AS gtid_mode, @@global.binlog_format AS binlog_format
  register: migrate_settings
  changed_when: false
  no_log: true
- name: Require GTID ON and ROW binlog format
  ansible.builtin.assert:
    that:
    - migrate_settings.query_result[0][0].gtid_mode == 'ON'
    - migrate_settings.query_result[0][0].binlog_format == 'ROW'
    fail_msg: Group Replication needs GTID ON and ROW binlog format. Convert the standalone first; see docs/migrate-standalone-to-gr.md.
- name: Find non-InnoDB user tables
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: >-
      SELECT TABLE_SCHEMA, TABLE_NAME, ENGINE FROM information_schema.TABLES
      WHERE TABLE_SCHEMA NOT IN ('mysql','information_schema','performance_schema','sys')
      AND TABLE_TYPE='BASE TABLE' AND ENGINE != 'InnoDB'
  register: migrate_engines
  changed_when: false
- name: Require all user tables to be InnoDB
  ansible.builtin.assert:
    that: migrate_engines.query_result[0] | length == 0
    fail_msg: "Non-InnoDB tables found: {{ migrate_engines.query_result[0] }}. Convert them with ALTER TABLE ... ENGINE=InnoDB first."
- name: Find user tables without a primary key
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: >-
      SELECT t.TABLE_SCHEMA, t.TABLE_NAME FROM information_schema.TABLES t
      LEFT JOIN (SELECT DISTINCT TABLE_SCHEMA, TABLE_NAME FROM information_schema.STATISTICS WHERE INDEX_NAME='PRIMARY') p
      ON t.TABLE_SCHEMA=p.TABLE_SCHEMA AND t.TABLE_NAME=p.TABLE_NAME
      WHERE p.TABLE_NAME IS NULL
      AND t.TABLE_SCHEMA NOT IN ('mysql','information_schema','performance_schema','sys')
      AND t.TABLE_TYPE='BASE TABLE'
  register: migrate_keys
  changed_when: false
- name: Require a primary key on every user table
  ansible.builtin.assert:
    that: migrate_keys.query_result[0] | length == 0
    fail_msg: "Tables without a primary key found: {{ migrate_keys.query_result[0] }}. Add primary keys first."
- name: Check backup tooling exists on the seed
  ansible.builtin.stat:
    path: /usr/local/bin/percona-backup
  register: migrate_backup_tool
- name: Require backup tooling before migration
  ansible.builtin.assert:
    that: migrate_backup_tool.stat.exists
    fail_msg: Run playbooks/backup.yml against the standalone first, so a full backup exists before migration.
- name: Take a full safety backup of the seed
  ansible.builtin.command:
    argv:
    - /usr/local/bin/percona-backup
    - backup
    - full
  register: migrate_backup
  changed_when: true
- name: Show seed transaction history for the record
  ansible.builtin.debug:
    msg: "Seed backup complete: {{ (migrate_backup.stdout | from_json).id }}"
