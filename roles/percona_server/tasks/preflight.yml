---
- name: Reject legacy feature switches
  ansible.builtin.assert:
    that:
    - percona_replication is not defined
    - percona_metrics_enabled is not defined
    - percona_backup_server is not defined
    - percona_orchestrator_install is not defined
    - percona_datadir is not defined
    fail_msg: Legacy all-in-one switches and percona_datadir are not accepted. Remove percona_datadir from inventory; the supported data directory is fixed at /var/lib/mysql. Follow docs/migration.md for component playbooks.
- name: Validate the supported server baseline
  ansible.builtin.assert:
    that:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_version in ['22.04', '24.04']
    - percona_version == '8.0'
    - percona_root_password | length >= 12
    - percona_root_password != 'changeme'
    - percona_server_id | int > 0
    - percona_server_id | int <= 4294967295
    - not percona_require_secure_transport or (percona_tls_ca | length > 0 and percona_tls_cert | length > 0 and
      percona_tls_key | length > 0)
    - percona_read_only is boolean
    - percona_gtid_mode is boolean
    - percona_require_secure_transport is boolean
    fail_msg: Use Ubuntu 22.04/24.04, Percona 8.0, a unique server ID and Vault credentials. Datadir relocation
      is not automated.
- name: Validate memory sizing inputs
  ansible.builtin.assert:
    that:
    - percona_memory_mb | string is match('^[0-9]+$')
    - percona_memory_mb | int >= 512
    - percona_buffer_pool_percent | string is match('^[0-9]+$')
    - percona_buffer_pool_percent | int >= 10
    - percona_buffer_pool_percent | int <= 75
    - percona_max_connections | string is match('^[0-9]+$')
    - percona_max_connections | int > 0
    fail_msg: Use an integer sizing budget of at least 512 MiB, a buffer-pool percentage from 10 to 75, and a positive connection limit. Review actual workload headroom; these checks do not guarantee sufficient RAM.
- name: Inspect existing data directory
  ansible.builtin.stat:
    path: /var/lib/mysql/mysql
  register: percona_existing_data
- name: Inspect managed-state marker
  ansible.builtin.stat:
    path: /etc/mysql/percona-ansible-state.json
  register: percona_state_file
- name: Require deliberate adoption of an existing installation
  ansible.builtin.assert:
    that:
    - not percona_existing_data.stat.exists or percona_state_file.stat.exists or percona_adopt_existing | bool
    fail_msg: Existing database detected. Review docs/migration.md before setting percona_adopt_existing=true; no
      data is erased.
- name: Inspect existing database executable
  ansible.builtin.stat:
    path: /usr/sbin/mysqld
  register: percona_existing_binary
- name: Read existing server version before installing packages
  ansible.builtin.command:
    argv:
    - /usr/sbin/mysqld
    - --version
  register: percona_existing_version
  changed_when: false
  when: percona_existing_binary.stat.exists
- name: Never replace a different database generation
  ansible.builtin.assert:
    that:
    - not percona_existing_binary.stat.exists or (percona_existing_version.stdout is search('Ver 8\.0\.') and 'Percona'
      in percona_existing_version.stdout)
    fail_msg: Existing binary is not Percona 8.0. Migration is outside this playbook.
