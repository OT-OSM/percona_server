---
- name: Discover writer
  ansible.builtin.import_tasks: discover.yml
- name: Create application databases on the writer
  ansible.builtin.include_tasks: databases.yml
  args:
    apply:
      delegate_to: '{{ percona_account_host }}'
- name: Create application users on the writer
  ansible.builtin.include_tasks: users.yml
  args:
    apply:
      delegate_to: '{{ percona_account_host }}'
