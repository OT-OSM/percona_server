---
- name: Require verified HTTPS object storage and pinned client
  ansible.builtin.assert:
    that:
    - backup_minio_endpoint is match('^https://')
    - backup_minio_access_key | length > 0
    - backup_minio_secret_key | length > 0
    - backup_mc_url is match('^https://')
    - backup_mc_checksum | length > 0
    - backup_minio_bucket is match('^[a-z0-9][a-z0-9.-]+[a-z0-9]$')
    fail_msg: Configure an existing bucket, trusted TLS endpoint and pinned mc URL/checksum. No MinIO server is
      installed.
- name: Download verified MinIO client
  ansible.builtin.get_url:
    url: '{{ backup_mc_url }}'
    dest: /usr/local/bin/mc
    checksum: '{{ backup_mc_checksum }}'
    mode: '0755'
- name: Create private MinIO client directory
  ansible.builtin.file:
    path: /etc/percona-backup/mc
    state: directory
    mode: '0700'
- name: Render scoped object-storage credentials
  ansible.builtin.template:
    src: mc.json.j2
    dest: /etc/percona-backup/mc/config.json
    mode: '0600'
    validate: python3 -c 'import json,sys; json.load(open(sys.argv[1]))' %s
  no_log: true
  diff: false
- name: Verify access to the configured bucket without disabling TLS verification
  ansible.builtin.command:
    argv:
    - /usr/local/bin/mc
    - --config-dir
    - /etc/percona-backup/mc
    - stat
    - backup/{{ backup_minio_bucket }}
  changed_when: false
