---
- name: Validate backup configuration
  ansible.builtin.assert:
    that:
    - backup_storage in ['local', 'minio']
    - backup_db_password | length >= 12
    - backup_path is match('^/[a-zA-Z0-9_/-]+$')
    - backup_path not in ['/', '/var', '/var/lib/mysql']
    - backup_parallel | int > 0
    - percona_account_host in hostvars
    fail_msg: Configure private backup storage, credentials and the account writer.
- name: Verify backup source version
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT @@version AS version
  changed_when: false
  register: backup_source
- name: Keep backup source on 8.0
  ansible.builtin.assert:
    that:
    - backup_source.query_result[0][0].version is match('^8\.0\.')
    fail_msg: This workflow is for Percona 8.0 only.
