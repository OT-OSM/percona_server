---
- name: Run preflight
  ansible.builtin.import_tasks: preflight.yml
- name: Run install
  ansible.builtin.import_tasks: install.yml
- name: Run account
  ansible.builtin.import_tasks: account.yml
- name: Run configure
  ansible.builtin.import_tasks: configure.yml
- name: Run storage/minio
  ansible.builtin.import_tasks: storage/minio.yml
  when: backup_storage == 'minio'
- name: Run schedule
  ansible.builtin.import_tasks: schedule.yml
- name: Run validation
  ansible.builtin.import_tasks: validation.yml
