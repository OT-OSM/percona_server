---
percona_root_username: root
percona_root_password: ''
percona_socket: /var/run/mysqld/mysqld.sock
percona_port: 3306
percona_account_host: '{{ percona_primary }}'
orchestrator_version: 3.2.6
orchestrator_download_url: https://github.com/openark/orchestrator/releases/download/v{{ orchestrator_version }}/orchestrator-{{
  orchestrator_version }}-linux-amd64.tar.gz
orchestrator_checksum: ''
orchestrator_install_packages: true
orchestrator_listen_address: 127.0.0.1
orchestrator_port: 3000
orchestrator_db_user: orchestrator
orchestrator_db_password: ''
orchestrator_source_address: '{{ ansible_host | default(inventory_hostname) }}'
orchestrator_http_user: operator
orchestrator_http_password: ''
orchestrator_recovery_enabled: false
orchestrator_recovery_tested: false
orchestrator_recovery_filters: []
orchestrator_fencing_hook: ''
orchestrator_routing_hook: ''
