---
- name: Validate orchestration prerequisites
  ansible.builtin.assert:
    that:
    - ansible_facts.architecture == 'x86_64'
    - percona_primary in hostvars
    - hostvars[percona_primary].percona_address is defined
    - orchestrator_db_password | length >= 12
    - orchestrator_http_password | length >= 12
    - not orchestrator_install_packages or orchestrator_checksum | length > 0
    fail_msg: Provide topology/admin credentials, source addresses, and a verified binary checksum.
- name: Install local database module dependencies
  ansible.builtin.apt:
    name:
    - python3-pymysql
    - python3-cryptography
    state: present
