---
- name: Run preflight
  ansible.builtin.import_tasks: preflight.yml
- name: Run install
  ansible.builtin.import_tasks: install.yml
  when: orchestrator_install_packages | bool
- name: Run recovery
  ansible.builtin.import_tasks: recovery.yml
- name: Run accounts
  ansible.builtin.import_tasks: accounts.yml
- name: Run configure
  ansible.builtin.import_tasks: configure.yml
- name: Run discover
  ansible.builtin.import_tasks: discover.yml
- name: Run validation
  ansible.builtin.import_tasks: validation.yml
