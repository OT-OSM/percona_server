---
- name: Check orchestration health including its metadata backend
  ansible.builtin.uri:
    url: http://{{ orchestrator_listen_address }}:{{ orchestrator_port }}/api/health
    url_username: '{{ orchestrator_http_user }}'
    url_password: '{{ orchestrator_http_password }}'
    force_basic_auth: true
    return_content: true
  register: orchestrator_health
  retries: 6
  delay: 5
  until: orchestrator_health.status | default(0) == 200 and orchestrator_health.json.Code | default('ERROR') ==
    'OK'
  no_log: true
