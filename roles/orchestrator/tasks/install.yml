---
- name: Create unprivileged orchestration service account
  ansible.builtin.user:
    name: orchestrator
    system: true
    create_home: false
    shell: /usr/sbin/nologin
- name: Create binary and state directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.owner }}'
    mode: '0750'
  loop:
  - path: /opt/orchestrator-{{ orchestrator_version }}
    owner: root
  - path: /var/lib/orchestrator
    owner: orchestrator
- name: Allow service to traverse its binaries
  ansible.builtin.file:
    path: /opt/orchestrator-{{ orchestrator_version }}
    group: orchestrator
    mode: '0750'
- name: Download verified orchestration archive
  ansible.builtin.get_url:
    url: '{{ orchestrator_download_url }}'
    dest: /var/tmp/orchestrator-{{ orchestrator_version }}.tar.gz
    checksum: '{{ orchestrator_checksum }}'
    mode: '0644'
- name: Extract versioned orchestration binary
  ansible.builtin.unarchive:
    src: /var/tmp/orchestrator-{{ orchestrator_version }}.tar.gz
    dest: /opt/orchestrator-{{ orchestrator_version }}
    remote_src: true
    extra_opts:
    - --strip-components=4
    creates: /opt/orchestrator-{{ orchestrator_version }}/orchestrator
  notify: orchestrator_restart
