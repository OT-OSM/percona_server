---
- name: Run preflight
  ansible.builtin.import_tasks: preflight.yml
- name: Run install
  ansible.builtin.import_tasks: install.yml
  when: proxysql_install_packages | bool
- name: Run bootstrap
  ansible.builtin.import_tasks: bootstrap.yml
- name: Run accounts
  ansible.builtin.import_tasks: accounts.yml
- name: Run backends
  ansible.builtin.import_tasks: backends.yml
- name: Run users
  ansible.builtin.import_tasks: users.yml
- name: Run routing
  ansible.builtin.import_tasks: routing.yml
- name: Run validation
  ansible.builtin.import_tasks: validation.yml
