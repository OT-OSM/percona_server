---
- name: Detect existing proxy SQLite configuration
  ansible.builtin.stat:
    path: /var/lib/proxysql/proxysql.db
  register: proxysql_existing_state
- name: Write initial listener and admin settings only for a new proxy
  ansible.builtin.template:
    src: proxysql.cnf.j2
    dest: /etc/proxysql.cnf
    owner: root
    group: proxysql
    mode: '0640'
  when: not proxysql_existing_state.stat.exists
  no_log: true
  diff: false
- name: Start local proxy administrator
  ansible.builtin.service:
    name: proxysql
    state: started
    enabled: true
- name: Try desired proxy administrator
  community.mysql.mysql_query:
    login_user: '{{ proxysql_admin_user }}'
    login_password: '{{ proxysql_admin_password }}'
    login_host: 127.0.0.1
    login_port: 6032
    config_file: ''
    query: SELECT 1
  changed_when: false
  register: proxy_desired
  failed_when: false
  no_log: true
- name: Try explicitly provided existing proxy administrator
  community.mysql.mysql_query:
    login_user: '{{ proxysql_admin_user }}'
    login_password: '{{ proxysql_bootstrap_admin_password }}'
    login_host: 127.0.0.1
    login_port: 6032
    config_file: ''
    query: SELECT 1
  register: proxy_initial
  when: proxy_desired.query_result is not defined
  failed_when: false
  changed_when: false
  no_log: true
- name: Require working proxy administrator authentication
  ansible.builtin.assert:
    that:
    - proxy_desired.query_result is defined or proxy_initial.query_result is defined
    fail_msg: Provide proxysql_bootstrap_admin_password for an existing proxy. Its state is never reset.
- name: Update proxy admin credentials when bootstrap was required
  community.proxysql.proxysql_global_variables:
    login_user: '{{ proxysql_admin_user }}'
    login_password: '{{ proxysql_bootstrap_admin_password }}'
    login_host: 127.0.0.1
    login_port: 6032
    config_file: ''
    variable: admin-admin_credentials
    value: '{{ proxysql_admin_user }}:{{ proxysql_admin_password }}'
    load_to_runtime: false
    save_to_disk: false
  when: proxy_desired.query_result is not defined
  no_log: true
- name: Persist and activate administrator credential change
  community.proxysql.proxysql_manage_config:
    login_user: '{{ proxysql_admin_user }}'
    login_password: '{{ proxysql_bootstrap_admin_password }}'
    login_host: 127.0.0.1
    login_port: 6032
    config_file: ''
    action: '{{ item.action }}'
    config_settings: ADMIN VARIABLES
    direction: TO
    config_layer: '{{ item.layer }}'
  loop:
  - action: SAVE
    layer: DISK
  - action: LOAD
    layer: RUNTIME
  when: proxy_desired.query_result is not defined
  no_log: true
- name: Bind proxy admin to loopback
  community.proxysql.proxysql_global_variables:
    login_user: '{{ proxysql_admin_user }}'
    login_password: '{{ proxysql_admin_password }}'
    login_host: 127.0.0.1
    login_port: 6032
    config_file: ''
    variable: admin-mysql_ifaces
    value: 127.0.0.1:6032
  no_log: true
- name: Set explicit application listener
  community.proxysql.proxysql_global_variables:
    login_user: '{{ proxysql_admin_user }}'
    login_password: '{{ proxysql_admin_password }}'
    login_host: 127.0.0.1
    login_port: 6032
    config_file: ''
    variable: mysql-interfaces
    value: '{{ proxysql_listen_address }}:{{ proxysql_port }}'
  no_log: true
  notify: proxysql_restart
- name: Inspect existing active query rules before routing changes
  community.mysql.mysql_query:
    login_user: '{{ proxysql_admin_user }}'
    login_password: '{{ proxysql_admin_password }}'
    login_host: 127.0.0.1
    login_port: 6032
    config_file: ''
    query: SELECT rule_id FROM mysql_query_rules WHERE active=1
  register: proxysql_existing_rules
  changed_when: false
  no_log: true
- name: Do not claim writer-only routing over pre-existing rules
  ansible.builtin.assert:
    that:
    - proxysql_query_rules | length > 0 or proxysql_existing_rules.query_result[0] | length == 0
    fail_msg: Existing active query rules would override writer-only defaults. Review them and explicitly manage/remove
      entries; no rules are deleted implicitly.
