---
- name: Check real database scrape health
  ansible.builtin.uri:
    url: http://{{ '127.0.0.1' if exporter_listen_address == '0.0.0.0' else exporter_listen_address }}:{{ exporter_port
      }}/metrics
    return_content: true
  register: exporter_health
  retries: 12
  delay: 5
  until: exporter_health.status | default(0) == 200 and exporter_health.content | default('') is search('(?m)^mysql_up
    1(?:\.0)?$')
