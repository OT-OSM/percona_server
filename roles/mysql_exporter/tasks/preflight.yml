---
- name: Validate exporter prerequisites
  ansible.builtin.assert:
    that:
    - ansible_facts.architecture == 'x86_64'
    - exporter_db_password | length >= 12
    - percona_account_host in hostvars
    - hostvars[percona_account_host].percona_admin_password | default(percona_root_password) | length >= 12
    fail_msg: Set exporter credentials, an explicit account writer, and percona_admin_password on that writer. Binary
      is amd64.
