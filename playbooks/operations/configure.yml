---
- name: Apply MySQL configuration one node at a time
  hosts: database
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
  - name: Apply server settings without installing packages
    ansible.builtin.include_role:
      name: percona_server
      tasks_from: configure
- name: Apply database and user definitions
  hosts: database
  become: true
  gather_facts: false
  tasks:
  - name: Manage applications on the current writer
    ansible.builtin.include_role:
      name: percona_server
      tasks_from: applications
    run_once: true
