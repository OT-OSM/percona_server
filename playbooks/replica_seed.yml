---
- name: Restore a verified backup to one isolated target
  hosts: replicas
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  vars:
    backup_restore_as_replica: true
  pre_tasks:
  - name: Select only one target for this restore
    ansible.builtin.assert:
      that:
      - ansible_play_hosts_all | length == 1
      - backup_restore_target is defined
      - backup_restore_target == inventory_hostname
      - inventory_hostname != percona_primary
      - ansible_host | default(inventory_hostname) != hostvars[percona_primary].ansible_host | default(percona_primary)
      fail_msg: Use --limit <isolated target> and -e backup_restore_target=<same host>. The current writer is never
        a restore target.
  tasks:
  - name: Install restore tooling without creating or validating a source account
    ansible.builtin.import_role:
      name: percona_backup
      tasks_from: prepare_target
  - name: Run only the explicit restore entry point
    ansible.builtin.import_role:
      name: percona_backup
      tasks_from: restore
