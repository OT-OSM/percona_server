---
# VARIABLE GUIDE — lower priority -> higher priority for this inventory:
# 1. roles/percona_server/defaults/main.yml       (fallback values)
# 2. inventories/lab/group_vars/all/             (main.yml + your vault.yml)
# 3. Host values below, e.g. db1.ansible_host     (inline host overrides)
# 4. inventories/lab/host_vars/db1.yml            (db1-specific overrides)
# 5. Command-line -e key=value                   (highest priority)
# Only matching variable names override earlier values; others remain available.
# Ansible discovers group_vars/ and host_vars/ automatically by group/host name.
# These comments describe precedence, not a sequence of file-import commands.
# =====================================================================================

all:
  # Shared settings: group_vars/all/main.yml; secrets: group_vars/all/vault.yml.
  # A real "vars:" block here could hold inline shared values, not file paths to load.
  # Keep shared values in group_vars/all/ so there is one obvious place to edit them.
  children:
    database:
      # Groups primary + replicas together for playbooks targeting "database".
      children:
        primary:
          hosts:
            db1:
              # Inventory name "db1" selects host_vars/db1.yml automatically.
              ansible_host: localhost
              ansible_connection: local
        replicas:
          # Empty group; add db2 here when ready, with its own ansible_host.
          hosts: {}
    backup_sources:
      hosts:
        # Same db1 as above; {} means no additional host variables defined here.
        db1: {}
    monitoring_targets:
      hosts:
        # Select db1 for monitoring; membership alone does not run a role.
        db1: {}
    proxies:
      hosts: {}
    orchestrators:
      hosts: {}
    restore_targets:
      hosts: {}
