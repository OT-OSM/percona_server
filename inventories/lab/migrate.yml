---
# Migration inventory: one existing standalone becomes the group seed.
# The standalone MUST be listed first in gr_members; percona_group_seed
# defaults to the first member. The two new servers must be fresh Ubuntu
# 24.04 installs with no MySQL data.
# Usage: ansible-playbook -i inventories/lab/migrate.yml playbooks/migrate-to-gr.yml --ask-vault-pass
all:
  children:
    seed:
      hosts:
        db1:
          ansible_host: 192.0.2.11
          percona_server_id: 101
    database:
      children:
        gr_members:
          hosts:
            db1:
              ansible_host: 192.0.2.11
              percona_server_id: 101
            db2:
              ansible_host: 192.0.2.12
              percona_server_id: 102
            db3:
              ansible_host: 192.0.2.13
              percona_server_id: 103
    proxies:
      hosts:
        proxy1:
          ansible_host: 192.0.2.21
          proxysql_ha_priority: 110
        proxy2:
          ansible_host: 192.0.2.22
          proxysql_ha_priority: 100
    backup_sources:
      hosts:
        db3: {}
    monitoring_targets:
      hosts:
        db1: {}
        db2: {}
        db3: {}
    restore_targets:
      hosts: {}
