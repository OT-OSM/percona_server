---
# 3. Existing db1 + two fresh database VMs + two ProxySQL servers. Keep db1 IP and credentials.
# Choose this file only; replace ansible_host addresses with your VM IPs.
all:
  children:
    seed:
      hosts:
        db1:
          ansible_host: 192.0.2.11
          percona_server_id: 101
    database:
      children:
        gr_members:
          hosts:
            db1:
              ansible_host: 192.0.2.11
              percona_server_id: 101
            db2:
              ansible_host: 192.0.2.12
              percona_server_id: 102
            db3:
              ansible_host: 192.0.2.13
              percona_server_id: 103
    proxies:
      hosts:
        proxy1:
          ansible_host: 192.0.2.21
          proxysql_ha_priority: 110
        proxy2:
          ansible_host: 192.0.2.22
          proxysql_ha_priority: 100
    backup_sources:
      hosts:
        db3: {}
    monitoring_targets:
      hosts:
        db1: {}
        db2: {}
        db3: {}
    restore_targets:
      hosts: {}
